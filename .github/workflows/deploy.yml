name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Secret OPENROUTER_API_KEY não configurado."
            exit 1
          fi
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest *.png *.jpg favicon.ico _site/
          python3 - <<'PY'
          import os
          p = '_site/index.html'
          s = open(p, encoding='utf-8').read()
          s = s.replace('__OPENROUTER_API_KEY__', os.environ['OPENROUTER_API_KEY'])
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
