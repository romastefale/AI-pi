name: Deploy Telegram Serverless

on:
  push:
    branches: [main]
    paths: ['tgcloud/**', 'app/**', 'tgcloud.jsonc', 'package.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inject OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Secret OPENROUTER_API_KEY não configurado."
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const p = 'tgcloud/lib/config.js';
            fs.writeFileSync(p, fs.readFileSync(p, 'utf8').replace('__OPENROUTER_API_KEY__', process.env.OPENROUTER_API_KEY));
          "

      - run: npm install

      # O repositório é a fonte da verdade; o CI começa sem estado local, então força o push.
      - name: Push modules
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud push --force

      # Aplica só mudanças seguras (tabelas/colunas/índices novos); drops ficam para rodar à mão.
      - name: Migrate database
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud migrate --safe

      - name: Sync webhook
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud webhook sync
