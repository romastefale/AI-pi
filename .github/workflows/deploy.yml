name: Deploy Telegram Serverless

on:
  push:
    branches: [main]
    paths: ['tgcloud/**', 'app/**', 'tgcloud.jsonc', 'package.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Sincroniza o estado local com a nuvem antes do push (sem --force).
      - name: Fetch cloud state
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud fetch

      # O push imprime o endereço do Mini App; a saída vai também para o resumo do run.
      - name: Push modules and Mini App
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          set -o pipefail
          npx tgcloud push 2>&1 | tee push.log
          { echo '## tgcloud push'; echo '```'; cat push.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Aplica só mudanças seguras (tabelas/colunas/índices novos); drops ficam para rodar à mão.
      - name: Migrate database
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud migrate --safe

      - name: Sync webhook
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud webhook sync
